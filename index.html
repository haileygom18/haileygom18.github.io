<!DOCTYPE html>
<html>
  <head>
      <title>Haybay Gallery</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="top-section">
        <h1 class="page-title" onclick="window.location.href='index.html'">Hailey Gomez Personal Website🤍</h1>
      <div class="intro-section">
      <div class="p-back">
       <p class="page-description">
        Photo Dump</p>
      </div>
      </div>    
      </header>
    <button class= "contact-button" onclick="window.location.href='contact.html'">Contact</button>
    <button class="experiance-button" onclick="window.location.href='resume.html'">Experiance</button>
    <button class="porfolio-button" onclick="window.location.href='portfolio.html'">Portfolio</button>
    <main>
      <div class="carousel-row">
        <button class="arrow-left" type="button">←</button>
        <div class="carousel1">
          <img class="carousel-image" src="images/desert.JPG" alt="gallery photo">
        </div>

        <div class="carousel2">
          <img class="carousel-image" src="images/c2-1.JPG" alt="gallery photo">
        </div>

        <div class="carousel3">
          <img class="carousel-image" src="images/c3-1.jpg" alt="gallery photo">
        </div>
        <button class="arrow-right" type="button">→</button> 
      </div>
      <div>
        <video class="video" autoplay loop muted playsinline>
          <source src="videos/video-cover.mp4" type="video/mp4">
        </video>
      </div>
    </main>
    <script>

      function showPhoto(image,photoList,current) {
        image.style.opacity = 0;

        setTimeout(function() {
          image.src = photoList[current];
          image.style.opacity = 1;
        }, 250);
      }
      const carousel1Image = document.querySelector(".carousel1 .carousel-image");
      const carousel2Image = document.querySelector(".carousel2 .carousel-image");
      const carousel3Image = document.querySelector(".carousel3 .carousel-image");

      const C1photos = ["images/desert.JPG", "images/homepage.png","images/spin.png", "images/IA.png"];
      const C2photos = ["images/c2-1.JPG", "images/c2-2.JPG", "images/c2-3.JPG", "images/c2-4.JPG"];
      const C3photos = ["images/c3-1.jpg", "images/c3-2.JPG", "images/c3-3.jpg"];
      let C1currentPhoto= 0;
      let C2currentPhoto= 0;
      let C3currentPhoto= 0;

      function changeGallery(direction) {
        C1currentPhoto = (C1currentPhoto + direction + C1photos.length) % C1photos.length;
        C2currentPhoto = (C2currentPhoto + direction + C2photos.length) % C2photos.length;
        C3currentPhoto = (C3currentPhoto + direction + C3photos.length) % C3photos.length;
      
        showPhoto(carousel1Image, C1photos, C1currentPhoto);
        showPhoto(carousel2Image, C2photos, C2currentPhoto);
        showPhoto(carousel3Image, C3photos, C3currentPhoto);
      }

      document.querySelector(".arrow-left").addEventListener("click", function() {
        changeGallery(-1);
      });

      document.querySelector(".arrow-right").addEventListener("click",function(){
        changeGallery(1);
      });

      setInterval(function() {
        C1currentPhoto = C1currentPhoto + 1;

        if (C1currentPhoto === C1photos.length) {
          C1currentPhoto = 0;
        }
        
        carousel1Image.src = C1photos[C1currentPhoto];
      }, 3000);

      setInterval(function() {
           C2currentPhoto = C2currentPhoto + 1;

        if (C2currentPhoto === C2photos.length) {
          C2currentPhoto = 0;
        }
        
        carousel2Image.src = C2photos[C2currentPhoto];
      }, 3000);

      setInterval(function() {
         C3currentPhoto = C3currentPhoto + 1;

        if (C3currentPhoto === C3photos.length) {
          C3currentPhoto = 0;
        }
        
        carousel3Image.src = C3photos[C3currentPhoto];
      }, 3000);
 
    </script>
  </body>
